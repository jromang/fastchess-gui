name: Fuzzing

on:
  push:
    branches: ["gui"]
    # Not for a change of the documentation alone.
    paths: ["**", "!**.md", "!docs/**"]
  pull_request:
    branches: ["gui"]
    paths: ["**", "!**.md", "!docs/**"]
  schedule:
    - cron: "11 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the branch or to the pull request makes the run still going useless: it is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: libFuzzer, every target at once
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7

      - name: Use the main Ubuntu archive
        # The runners' Azure mirror can stay unresolvable for hours; the main archive does not depend on it.
        run: |
          sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#' \
            -e 's#http://azure.archive.ubuntu.com/ubuntu/*#http://archive.ubuntu.com/ubuntu/#' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          # The runner's resolver can fail on Ubuntu's hosts alone: public resolvers then.
          if ! getent hosts archive.ubuntu.com > /dev/null; then
            sudo mkdir -p /etc/systemd/resolved.conf.d
            printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\n' | sudo tee /etc/systemd/resolved.conf.d/fallback.conf
            sudo systemctl restart systemd-resolved
            getent hosts archive.ubuntu.com || true
          fi

      - name: Install dependencies
        # clang 23 from LLVM's own archive (Ubuntu 24.04 ships 18), the version the fuzzers are written against.
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm-23.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache clang-23 libclang-rt-23-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev \
            libdrm-dev libgbm-dev libdbus-1-dev libudev-dev

      - name: Address space randomisation AddressSanitizer works with
        # The runner's kernel randomises more address bits than the sanitizers' shadow memory allows.
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Compiler cache
        # What the last runs compiled (the dependencies above all): only what changed is compiled again.
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-fuzz-${{ github.run_id }}
          restore-keys: ccache-fuzz-

      - name: Configure
        env:
          CC: clang-23
          CXX: clang++-23
        run: cmake -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFCG_FUZZ=ON -DFCG_BUILD_TESTS=OFF

      - name: Build
        run: |
          ccache -z
          cmake --build build-fuzz --target fuzz_web_request fuzz_tunnel_text fuzz_tlcs_message fuzz_pgn_book \
            fuzz_epd_book fuzz_app_pgn fuzz_engine_info
          ccache -s

      - name: The corpora of earlier runs
        uses: actions/cache@v6
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz
        # Every target at once, from its seeds and what earlier runs found: 15 seconds on every change, two minutes
        # every week or when asked for. Any undefined behaviour stops a target as a crash does. A crash fails the job,
        # in the program's own code as in fastchess' readers (app/). The inputs that crash are kept.
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          FUZZ_SECONDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 120 || 15 }}
        run: |
          targets=(web_request tunnel_text tlcs_message pgn_book epd_book app_pgn engine_info)
          pids=()
          for target in "${targets[@]}"; do
            mkdir -p "fuzz-corpus/${target}" "fuzz-crashes/${target}"
            "./build-fuzz/fuzz_${target}" -max_total_time="${FUZZ_SECONDS}" -max_len=65536 -timeout=10 \
              -rss_limit_mb=4096 -artifact_prefix="fuzz-crashes/${target}/" "fuzz-corpus/${target}" \
              "fuzz/corpus/${target}" > "fuzz-${target}.log" 2>&1 &
            pids+=($!)
          done
          failed=()
          for i in "${!targets[@]}"; do
            if ! wait "${pids[$i]}"; then
              failed+=("${targets[$i]}")
            fi
            echo "::group::${targets[$i]}"
            cat "fuzz-${targets[$i]}.log"
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::crashed: ${failed[*]}"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('fuzz-crashes/**') != ''
        with:
          name: fuzz-crashes
          path: fuzz-crashes
