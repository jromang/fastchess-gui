name: fastchess-gui

on:
  push:
    branches: ["gui"]
    tags: ["v*"]
    # Not for a change of the documentation alone (docs/guide.md excepted: a test reads it). Tags are not filtered:
    # a release is always built.
    paths: ["**", "!**.md", "!docs/**", "docs/guide.md"]
  pull_request:
    branches: ["gui"]
    paths: ["**", "!**.md", "!docs/**", "docs/guide.md"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the branch or to the pull request makes the run still going useless: it is cancelled. Never a
# release's.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux:
    name: Linux build and tests
    # The oldest supported runner, so that the binary runs on older glibc versions too.
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7

      - name: Use the main Ubuntu archive
        # The runners' Azure mirror can stay unresolvable for hours; the main archive does not depend on it.
        run: |
          sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#' \
            -e 's#http://azure.archive.ubuntu.com/ubuntu/*#http://archive.ubuntu.com/ubuntu/#' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          # The runner's resolver can fail on Ubuntu's hosts alone: public resolvers then.
          if ! getent hosts archive.ubuntu.com > /dev/null; then
            sudo mkdir -p /etc/systemd/resolved.conf.d
            printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\n' | sudo tee /etc/systemd/resolved.conf.d/fallback.conf
            sudo systemctl restart systemd-resolved
            getent hosts archive.ubuntu.com || true
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache g++-12 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev \
            libdrm-dev libgbm-dev libdbus-1-dev libudev-dev

      - name: Compiler cache
        # What the last runs compiled (the dependencies above all): only what changed is compiled again.
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-linux-${{ github.run_id }}
          restore-keys: ccache-linux-

      - name: Configure
        env:
          CC: gcc-12
          CXX: g++-12
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFCG_STATIC_RUNTIME=ON

      - name: Build
        run: |
          ccache -z
          cmake --build build
          ccache -s

      - name: Tests
        # Side by side, each test case in a process of its own (tools/run_tests.py): they mostly wait, so two per
        # processor. fastchess' own tests run when app/ changes (upstream_tests.yml).
        run: python3 tools/run_tests.py -j 8 build/fastchess-gui-tests build/fcg-tournament-tests

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            build/fastchess-gui
            build/fastchess

  sanitizers:
    name: Linux tests with AddressSanitizer and UBSan
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7

      - name: Use the main Ubuntu archive
        # The runners' Azure mirror can stay unresolvable for hours; the main archive does not depend on it.
        run: |
          sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#' \
            -e 's#http://azure.archive.ubuntu.com/ubuntu/*#http://archive.ubuntu.com/ubuntu/#' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          # The runner's resolver can fail on Ubuntu's hosts alone: public resolvers then.
          if ! getent hosts archive.ubuntu.com > /dev/null; then
            sudo mkdir -p /etc/systemd/resolved.conf.d
            printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\n' | sudo tee /etc/systemd/resolved.conf.d/fallback.conf
            sudo systemctl restart systemd-resolved
            getent hosts archive.ubuntu.com || true
          fi

      - name: Install dependencies
        # clang 23 from LLVM's archive, as for the fuzzers: everything instrumented compiles in a third of gcc's time.
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm-23.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache clang-23 libclang-rt-23-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev \
            libdrm-dev libgbm-dev libdbus-1-dev libudev-dev

      - name: Address space randomisation AddressSanitizer works with
        # The runner's kernel randomises more address bits than the sanitizers' shadow memory allows.
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Compiler cache
        # What the last runs compiled (the dependencies above all): only what changed is compiled again.
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-sanitizers-${{ github.run_id }}
          restore-keys: ccache-sanitizers-

      - name: Configure
        # Everything instrumented, the dependencies too; the test engines the tests start as well.
        env:
          CC: clang-23
          CXX: clang++-23
        run: >
          cmake -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        run: |
          ccache -z
          cmake --build build-asan --target fastchess-gui-tests fcg-tournament-tests
          ccache -s

      - name: Tests
        # Side by side, each test case in a process of its own (tools/run_tests.py), one per processor: instrumented,
        # they are slower and some of their waits are short. Every report to a file of its process's own: the test
        # cases' and those of the engines they start, whose output the tests read. A report fails its test case; any
        # report fails the next step. Each call's locals on the stack, not in AddressSanitizer's heap for use after
        # return: libssh2 sends the rest of a keepalive only from a buffer at the same address as the first time, a
        # local of its keepalive function.
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=0:log_path=${{ runner.temp }}/sanitizers/report
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:log_path=${{ runner.temp }}/sanitizers/report
        run: |
          mkdir -p "${RUNNER_TEMP}/sanitizers"
          python3 tools/run_tests.py -j 4 build-asan/fastchess-gui-tests build-asan/fcg-tournament-tests

      - name: Sanitizer reports
        if: always()
        run: |
          shopt -s nullglob
          reports=("${RUNNER_TEMP}"/sanitizers/*)
          for report in "${reports[@]}"; do echo "== ${report}"; cat "${report}"; done
          [ ${#reports[@]} -eq 0 ]

  windows-build:
    name: Windows cross-build
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7

      - name: Use the main Ubuntu archive
        # The runners' Azure mirror can stay unresolvable for hours; the main archive does not depend on it.
        run: |
          sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#' \
            -e 's#http://azure.archive.ubuntu.com/ubuntu/*#http://archive.ubuntu.com/ubuntu/#' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          # The runner's resolver can fail on Ubuntu's hosts alone: public resolvers then.
          if ! getent hosts archive.ubuntu.com > /dev/null; then
            sudo mkdir -p /etc/systemd/resolved.conf.d
            printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\n' | sudo tee /etc/systemd/resolved.conf.d/fallback.conf
            sudo systemctl restart systemd-resolved
            getent hosts archive.ubuntu.com || true
          fi

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache mingw-w64

      - name: Compiler cache
        # What the last runs compiled (the dependencies above all): only what changed is compiled again.
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-windows-${{ github.run_id }}
          restore-keys: ccache-windows-

      - name: Configure
        run: >
          cmake -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake -DMINGW_SUFFIX=-posix

      - name: Build
        run: |
          ccache -z
          cmake --build build-win
          ccache -s

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            build-win/fastchess-gui.exe
            build-win/fastchess.exe
            build-win/fastchess-gui-tests.exe
            build-win/fcg-tournament-tests.exe
            build-win/fcg_random_mover.exe

  windows-tests:
    name: Windows tests
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: bin

      - name: Tests
        # Side by side, each test case in a process of its own (tools/run_tests.py).
        env:
          FCG_SOURCE_DIR: ${{ github.workspace }}
        run: python tools/run_tests.py -j 8 bin\fastchess-gui-tests.exe bin\fcg-tournament-tests.exe

  macos:
    name: macOS build and tests
    # Apple silicon. The programs are universal (arm64 and x86_64), for macOS 13.3 and later.
    runs-on: macos-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja and ccache
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          command -v ninja || brew install ninja
          command -v ccache || brew install ccache

      - name: Compiler cache
        # What the last runs compiled (the dependencies above all): only what changed is compiled again.
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-macos-${{ github.run_id }}
          restore-keys: ccache-macos-

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: |
          ccache -z
          cmake --build build
          ccache -s

      - name: Universal binaries
        run: |
          for program in build/fastchess-gui.app/Contents/MacOS/fastchess-gui build/fastchess; do
            echo "${program}: $(lipo -archs "${program}"), $(vtool -show-build "${program}" | grep -m1 minos)"
            lipo "${program}" -verify_arch arm64 x86_64
          done

      - name: Tests
        # Side by side, each test case in a process of its own (tools/run_tests.py), two per processor.
        run: python3 tools/run_tests.py -j 6 build/fastchess-gui-tests build/fcg-tournament-tests

      - name: Package
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME}"; else version="${GITHUB_SHA::7}"; fi
          macos="fastchess-gui-${version}-macos-universal"
          mkdir -p "dist/${macos}"
          cp -R build/fastchess-gui.app build/fastchess "dist/${macos}/"
          cp README.md LICENSE docs/guide.md gui/assets/ATTRIBUTION.md "dist/${macos}/"
          cp -R gui/assets/licenses "dist/${macos}/"
          # Not signed by a developer (that needs an Apple Developer account): signed ad hoc, the whole bundle
          # sealed, which Apple silicon requires. Gatekeeper still asks, at the first start, to allow it.
          codesign --force --deep --sign - "dist/${macos}/fastchess-gui.app"
          codesign --force --sign - "dist/${macos}/fastchess"
          codesign --verify --deep --strict "dist/${macos}/fastchess-gui.app"
          # ditto keeps the bundle as it is: permissions, signature, extended attributes.
          ditto -c -k --keepParent "dist/${macos}" "dist/${macos}.zip"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows-build, windows-tests, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package
        run: |
          version="${GITHUB_REF_NAME}"
          docs="README.md LICENSE docs/guide.md gui/assets/ATTRIBUTION.md"

          linux="fastchess-gui-${version}-linux-x86_64"
          mkdir -p "dist/${linux}"
          cp artifacts/linux/fastchess-gui "dist/${linux}/"
          chmod +x "dist/${linux}/fastchess-gui"
          cp ${docs} "dist/${linux}/"
          cp -r gui/assets/licenses "dist/${linux}/"
          tar -C dist -czf "dist/${linux}.tar.gz" "${linux}"

          windows="fastchess-gui-${version}-windows-x86_64"
          mkdir -p "dist/${windows}"
          cp artifacts/windows/fastchess-gui.exe "dist/${windows}/"
          cp ${docs} "dist/${windows}/"
          cp -r gui/assets/licenses "dist/${windows}/"
          (cd dist && zip -qr "${windows}.zip" "${windows}")

          # Packaged on the Mac, the application bundle signed there.
          cp "artifacts/macos/fastchess-gui-${version}-macos-universal.zip" dist/

          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS.txt)
          ls -l dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          gh release create "${GITHUB_REF_NAME}" --title "fastchess-gui ${GITHUB_REF_NAME}" "${args[@]}" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt
