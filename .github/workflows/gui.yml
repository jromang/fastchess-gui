name: fastchess-gui

on:
  push:
    branches: ["gui"]
    tags: ["v*"]
  pull_request:
    branches: ["gui"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux build and tests
    # The oldest supported runner, so that the binary runs on older glibc versions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Use the main Ubuntu archive
        # The runners' Azure mirror can stay unresolvable for hours; the main archive does not depend on it.
        run: |
          sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#' \
            -e 's#http://azure.archive.ubuntu.com/ubuntu/*#http://archive.ubuntu.com/ubuntu/#' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          # The runner's resolver can fail on Ubuntu's hosts alone: public resolvers then.
          if ! getent hosts archive.ubuntu.com > /dev/null; then
            sudo mkdir -p /etc/systemd/resolved.conf.d
            printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\n' | sudo tee /etc/systemd/resolved.conf.d/fallback.conf
            sudo systemctl restart systemd-resolved
            getent hosts archive.ubuntu.com || true
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-12 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev \
            libdrm-dev libgbm-dev libdbus-1-dev libudev-dev

      - name: Configure
        env:
          CC: gcc-12
          CXX: g++-12
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFCG_STATIC_RUNTIME=ON

      - name: Build
        run: cmake --build build

      - name: GUI tests
        run: ./build/fastchess-gui-tests

      - name: Tournament layer tests
        run: ./build/fcg-tournament-tests

      - name: Upstream fastchess tests
        run: |
          make -C app -j"$(nproc)" tests CXX=g++-12
          ./app/fastchess-tests

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            build/fastchess-gui
            build/fastchess

  sanitizers:
    name: Linux tests with AddressSanitizer and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Use the main Ubuntu archive
        # The runners' Azure mirror can stay unresolvable for hours; the main archive does not depend on it.
        run: |
          sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#' \
            -e 's#http://azure.archive.ubuntu.com/ubuntu/*#http://archive.ubuntu.com/ubuntu/#' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          # The runner's resolver can fail on Ubuntu's hosts alone: public resolvers then.
          if ! getent hosts archive.ubuntu.com > /dev/null; then
            sudo mkdir -p /etc/systemd/resolved.conf.d
            printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\n' | sudo tee /etc/systemd/resolved.conf.d/fallback.conf
            sudo systemctl restart systemd-resolved
            getent hosts archive.ubuntu.com || true
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-14 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev \
            libdrm-dev libgbm-dev libdbus-1-dev libudev-dev

      - name: Address space randomisation AddressSanitizer works with
        # The runner's kernel randomises more address bits than the sanitizers' shadow memory allows.
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        # Everything instrumented, the dependencies too; the test engines the tests start as well.
        env:
          CC: gcc-14
          CXX: g++-14
        run: >
          cmake -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan --target fastchess-gui-tests fcg-tournament-tests

      - name: Tests
        # Every report to a file of its process's own: the test programs' and those of the engines they start, whose
        # output the tests read. A report fails the test program; any report fails the next step. Each call's locals
        # on the stack, not in AddressSanitizer's heap for use after return: libssh2 sends the rest of a keepalive
        # only from a buffer at the same address as the first time, a local of its keepalive function.
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=0:log_path=${{ runner.temp }}/sanitizers/report
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:log_path=${{ runner.temp }}/sanitizers/report
        run: |
          mkdir -p "${RUNNER_TEMP}/sanitizers"
          ./build-asan/fastchess-gui-tests
          ./build-asan/fcg-tournament-tests

      - name: Sanitizer reports
        if: always()
        run: |
          shopt -s nullglob
          reports=("${RUNNER_TEMP}"/sanitizers/*)
          for report in "${reports[@]}"; do echo "== ${report}"; cat "${report}"; done
          [ ${#reports[@]} -eq 0 ]

  windows-build:
    name: Windows cross-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Use the main Ubuntu archive
        # The runners' Azure mirror can stay unresolvable for hours; the main archive does not depend on it.
        run: |
          sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#' \
            -e 's#http://azure.archive.ubuntu.com/ubuntu/*#http://archive.ubuntu.com/ubuntu/#' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          # The runner's resolver can fail on Ubuntu's hosts alone: public resolvers then.
          if ! getent hosts archive.ubuntu.com > /dev/null; then
            sudo mkdir -p /etc/systemd/resolved.conf.d
            printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\n' | sudo tee /etc/systemd/resolved.conf.d/fallback.conf
            sudo systemctl restart systemd-resolved
            getent hosts archive.ubuntu.com || true
          fi

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build mingw-w64

      - name: Configure
        run: >
          cmake -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake -DMINGW_SUFFIX=-posix

      - name: Build
        run: cmake --build build-win

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            build-win/fastchess-gui.exe
            build-win/fastchess.exe
            build-win/fastchess-gui-tests.exe
            build-win/fcg-tournament-tests.exe
            build-win/fcg_random_mover.exe

  windows-tests:
    name: Windows tests
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: bin

      - name: GUI tests
        env:
          FCG_SOURCE_DIR: ${{ github.workspace }}
        run: bin\fastchess-gui-tests.exe

      - name: Tournament layer tests
        run: bin\fcg-tournament-tests.exe

  macos:
    name: macOS build and tests
    # Apple silicon. The programs are universal (arm64 and x86_64), for macOS 11 and later.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: command -v ninja || brew install ninja

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build build

      - name: Universal binaries
        run: |
          for program in build/fastchess-gui.app/Contents/MacOS/fastchess-gui build/fastchess; do
            echo "${program}: $(lipo -archs "${program}"), $(vtool -show-build "${program}" | grep -m1 minos)"
            lipo "${program}" -verify_arch arm64 x86_64
          done

      - name: GUI tests
        run: ./build/fastchess-gui-tests

      - name: Tournament layer tests
        run: ./build/fcg-tournament-tests

      - name: Package
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME}"; else version="${GITHUB_SHA::7}"; fi
          macos="fastchess-gui-${version}-macos-universal"
          mkdir -p "dist/${macos}"
          cp -R build/fastchess-gui.app build/fastchess "dist/${macos}/"
          cp README.md LICENSE docs/guide.md gui/assets/ATTRIBUTION.md "dist/${macos}/"
          cp -R gui/assets/licenses "dist/${macos}/"
          # Not signed by a developer (that needs an Apple Developer account): signed ad hoc, the whole bundle
          # sealed, which Apple silicon requires. Gatekeeper still asks, at the first start, to allow it.
          codesign --force --deep --sign - "dist/${macos}/fastchess-gui.app"
          codesign --force --sign - "dist/${macos}/fastchess"
          codesign --verify --deep --strict "dist/${macos}/fastchess-gui.app"
          # ditto keeps the bundle as it is: permissions, signature, extended attributes.
          ditto -c -k --keepParent "dist/${macos}" "dist/${macos}.zip"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows-build, windows-tests, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package
        run: |
          version="${GITHUB_REF_NAME}"
          docs="README.md LICENSE docs/guide.md gui/assets/ATTRIBUTION.md"

          linux="fastchess-gui-${version}-linux-x86_64"
          mkdir -p "dist/${linux}"
          cp artifacts/linux/fastchess-gui "dist/${linux}/"
          chmod +x "dist/${linux}/fastchess-gui"
          cp ${docs} "dist/${linux}/"
          cp -r gui/assets/licenses "dist/${linux}/"
          tar -C dist -czf "dist/${linux}.tar.gz" "${linux}"

          windows="fastchess-gui-${version}-windows-x86_64"
          mkdir -p "dist/${windows}"
          cp artifacts/windows/fastchess-gui.exe "dist/${windows}/"
          cp ${docs} "dist/${windows}/"
          cp -r gui/assets/licenses "dist/${windows}/"
          (cd dist && zip -qr "${windows}.zip" "${windows}")

          # Packaged on the Mac, the application bundle signed there.
          cp "artifacts/macos/fastchess-gui-${version}-macos-universal.zip" dist/

          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS.txt)
          ls -l dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          gh release create "${GITHUB_REF_NAME}" --title "fastchess-gui ${GITHUB_REF_NAME}" "${args[@]}" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt
